services:
  postgres:
    image: postgres:16-alpine
    container_name: cits_postgres
    restart: always
    environment:
      POSTGRES_USER: cits_user
      POSTGRES_PASSWORD: cits_password_2026
      POSTGRES_DB: cits_db
    ports:
      - "5433:5432"
    volumes:
      - cits_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cits_user -d cits_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cits_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - cits_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cits_pgdata:
  cits_redisdata:
